<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Subtle accent line -->
  <rect x="200" y="340" width="800" height="1" fill="url(#accent)" />
  <!-- Name -->
  <text x="600" y="280" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">Daksh Verma</text>
  <!-- Role -->
  <text x="600" y="380" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="28" fill="#06b6d4" letter-spacing="4">Software Engineer</text>
  <!-- Subtle border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="2" />
</svg>
